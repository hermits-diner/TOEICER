[package]
name = "toeicer-app"
version = "0.1.0"
description = "TOEICER - TOEIC study app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "toeicer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
# Remembers the window size and position between launches.
tauri-plugin-window-state = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "cookies", "json", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "process", "io-util"] }
texting_robots = "0.2"
pdf-extract = "0.9"
encoding_rs = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
# The MP3 encoder that ships with Windows (Media Foundation), see src/mp3.rs.
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
