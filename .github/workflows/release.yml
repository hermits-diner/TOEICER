# Builds both Windows editions on a v* tag (TOEICER, the free reader, and TOEICER Studio) and attaches their
# installers to the GitHub release of that tag.
# The release may already exist (made by hand with a locally built exe); tauri-action then adds its assets to it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # The release takes the tag's name, but the installers and the backups report tauri.conf.json's version.
      # `npm version` keeps the two together; a tag made any other way stops here.
      - name: Check the tag names the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_NAME" != "$app" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but tauri.conf.json says $app. Make releases with npm version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Build TOEICER (reader) and attach it to the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TOEICER ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      - name: Build TOEICER Studio and attach it to the same release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TOEICER ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.studio.conf.json
