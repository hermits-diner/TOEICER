# Builds the Windows app on a v* tag and attaches the installer and the bare exe to the GitHub release of that tag.
# The release may already exist (made by hand with a locally built exe); tauri-action then adds its assets to it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TOEICER ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      - name: Attach the bare exe as well
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item src-tauri/target/release/toeicer-app.exe "toeicer-app-${{ github.ref_name }}.exe"
          gh release upload "${{ github.ref_name }}" "toeicer-app-${{ github.ref_name }}.exe" --clobber
