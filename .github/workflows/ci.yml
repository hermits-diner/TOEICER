# Checks every pushed branch. The frontend runs on Ubuntu; the Rust tests need Windows and live in ci-rust.yml,
# which runs only when src-tauri changes: in a private repo Windows minutes count double.
name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/tour/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Each build type-checks (tsc) before bundling its edition.
      - run: npm run build:studio

      - run: npm run build
